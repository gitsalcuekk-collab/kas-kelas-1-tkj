<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Kelas - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Navbar Header -->
  <header class="bg-indigo-600 text-white p-5 shadow-lg">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Kas Kelas <span id="namaKelas">...</span></h1>
      <button onclick="openModal()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-semibold shadow hover:bg-slate-100 transition">
        + Tambah Transaksi
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto mt-6 px-4 space-y-6">

    <!-- Card Ringkasan Saldo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow border-l-4 border-indigo-500">
        <p class="text-gray-500 text-sm">Total Saldo</p>
        <p class="text-2xl font-bold text-indigo-600" id="totalSaldo">Rp 0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow border-l-4 border-emerald-500">
        <p class="text-gray-500 text-sm">Total Pemasukan</p>
        <p class="text-2xl font-bold text-emerald-600" id="totalPemasukan">Rp 0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow border-l-4 border-rose-500">
        <p class="text-gray-500 text-sm">Total Pengeluaran</p>
        <p class="text-2xl font-bold text-rose-600" id="totalPengeluaran">Rp 0</p>
      </div>
    </div>

    <!-- Tabel Daftar Siswa & Bayar Kas -->
    <div class="bg-white p-6 rounded-xl shadow">
      <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3">
        <h2 class="text-xl font-bold">Daftar Siswa & Absen</h2>
        <input type="text" id="searchSiswa" onkeyup="filterSiswa()" placeholder="Cari nama atau nomor absen..." class="border rounded-lg px-4 py-2 w-full md:w-64 focus:outline-indigo-500">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 border-b">
              <th class="p-3">Absen</th>
              <th class="p-3">Nama Siswa</th>
              <th class="p-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelSiswa">
            <!-- Data siswa di-load dinamis -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4">Riwayat Aktivitas Transaksi</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 border-b">
              <th class="p-3">Waktu</th>
              <th class="p-3">Jenis</th>
              <th class="p-3">Keterangan</th>
              <th class="p-3">Jumlah</th>
              <th class="p-3">Dicatat Oleh</th>
            </tr>
          </thead>
          <tbody id="tabelRiwayat">
            <!-- Riwayat di-load dinamis -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Tambah Transaksi -->
  <div id="modalTransaksi" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative">
      <h2 class="text-xl font-bold mb-4">Form Transaksi Kas</h2>
      
      <form id="formTransaksi" onsubmit="simpanTransaksi(event)" class="space-y-3">
        <div>
          <label class="block text-sm font-medium">Jenis Transaksi</label>
          <select id="jenis" class="w-full border rounded-lg p-2 mt-1">
            <option value="pemasukan">Pemasukan (Bayar Kas)</option>
            <option value="pengeluaran">Pengeluaran</option>
          </select>
        </div>

        <div id="fieldSiswa">
          <label class="block text-sm font-medium">Nama Siswa / No. Absen (Opsional)</label>
          <input type="text" id="infoSiswa" placeholder="Contoh: Ahmad (Absen 1)" class="w-full border rounded-lg p-2 mt-1">
        </div>

        <div>
          <label class="block text-sm font-medium">Jumlah (Rp)</label>
          <input type="number" id="jumlah" required placeholder="10000" class="w-full border rounded-lg p-2 mt-1">
        </div>

        <div>
          <label class="block text-sm font-medium">Keterangan</label>
          <input type="text" id="keterangan" required placeholder="Uang kas minggu 1 / Beli spidol" class="w-full border rounded-lg p-2 mt-1">
        </div>

        <hr class="my-2">
        <p class="text-xs text-rose-600 font-semibold">*Verifikasi Admin Kas</p>

        <div>
          <label class="block text-sm font-medium">Username Admin</label>
          <input type="text" id="username" required placeholder="Suci" class="w-full border rounded-lg p-2 mt-1">
        </div>

        <div>
          <label class="block text-sm font-medium">Password Admin</label>
          <input type="password" id="password" required placeholder="••••••" class="w-full border rounded-lg p-2 mt-1">
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-slate-100">Batal</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let listSiswa = [];

    async function loadData() {
      const res = await fetch('/api/dashboard');
      const data = await res.json();

      document.getElementById('namaKelas').innerText = data.namaKelas;
      document.getElementById('totalSaldo').innerText = 'Rp ' + data.saldo.toLocaleString('id-ID');
      document.getElementById('totalPemasukan').innerText = 'Rp ' + data.totalPemasukan.toLocaleString('id-ID');
      document.getElementById('totalPengeluaran').innerText = 'Rp ' + data.totalPengeluaran.toLocaleString('id-ID');

      listSiswa = data.siswa;
      renderSiswa(listSiswa);
      renderRiwayat(data.riwayat);
    }

    function renderSiswa(siswa) {
      const tbody = document.getElementById('tabelSiswa');
      tbody.innerHTML = '';
      if (siswa.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-gray-500">Belum ada data siswa.</td></tr>';
        return;
      }
      siswa.forEach(s => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-3 font-semibold">${s.absen}</td>
            <td class="p-3">${s.nama}</td>
            <td class="p-3 text-right">
              <button onclick="bayarKasSiswa('${s.nama}', ${s.absen})" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded hover:bg-emerald-700">
                Bayar Kas
              </button>
            </td>
          </tr>
        `;
      });
    }

    function filterSiswa() {
      const query = document.getElementById('searchSiswa').value.toLowerCase();
      const filtered = listSiswa.filter(s => 
        s.nama.toLowerCase().includes(query) || s.absen.toString().includes(query)
      );
      renderSiswa(filtered);
    }

    function renderRiwayat(riwayat) {
      const tbody = document.getElementById('tabelRiwayat');
      tbody.innerHTML = '';
      if (!riwayat || riwayat.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-gray-500">Belum ada riwayat transaksi.</td></tr>';
        return;
      }
      riwayat.forEach(r => {
        const isMasuk = r.jenis === 'PEMASUKAN';
        tbody.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-3 text-xs text-gray-500">${r.waktu}</td>
            <td class="p-3"><span class="px-2 py-0.5 text-xs font-semibold rounded ${isMasuk ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${r.jenis}</span></td>
            <td class="p-3">${r.keterangan}</td>
            <td class="p-3 font-semibold ${isMasuk ? 'text-emerald-600' : 'text-rose-600'}">Rp ${r.jumlah.toLocaleString('id-ID')}</td>
            <td class="p-3 text-sm font-medium text-indigo-600">${r.oleh}</td>
          </tr>
        `;
      });
    }

    function bayarKasSiswa(nama, absen) {
      openModal();
      document.getElementById('jenis').value = 'pemasukan';
      document.getElementById('infoSiswa').value = `${nama} (Absen ${absen})`;
      document.getElementById('keterangan').value = `Pembayaran Kas - ${nama}`;
    }

    function openModal() {
      document.getElementById('modalTransaksi').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalTransaksi').classList.add('hidden');
      document.getElementById('formTransaksi').reset();
    }

    async function simpanTransaksi(e) {
      e.preventDefault();
      const jenis = document.getElementById('jenis').value;
      const jumlah = document.getElementById('jumlah').value;
      const keterangan = document.getElementById('keterangan').value;
      const infoSiswa = document.getElementById('infoSiswa').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/api/transaksi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jenis,
          jumlah,
          keterangan,
          namaSiswa: infoSiswa,
          username,
          password
        })
      });

      const result = await response.json();
      if (result.success) {
        alert(result.message);
        closeModal();
        loadData();
      } else {
        alert('Gagal: ' + result.message);
      }
    }

    loadData();
  </script>
</body>
</html>
